<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradingsignale 195 Min.</title>
<style>
  :root { --bg:#fff; --card:#f5f5f7; --fg:#1b1b1f; --mut:#7a7a85; --line:#e4e4e9; --row:#ebebef; --btn:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
          --long:#16a34a; --short:#e11d48; --blue:#0b5ed7; --sun:#f59e0b; --moon:#3b3a8f; --pop:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1b1b1f; --fg:#eee; --mut:#9a9aa6; --line:#2e2e35; --row:#232328; --btn:#2a2a31; --shadow:none; --pop:#26262c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { margin:20px; padding:36px 40px 24px; background:var(--card); border-radius:18px; min-height:80vh; }
  h1 { margin:0 0 12px; font-size:30px; font-weight:700; } h1 .acc { color:#3cb4e6; }
  .intro { font-size:13.5px; margin:0 0 28px; }
  .controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .grp { display:flex; background:var(--btn); border-radius:6px; box-shadow:var(--shadow); overflow:hidden; }
  .grp button, .single { border:0; background:transparent; color:var(--fg); font:600 12.5px inherit; font-family:inherit; padding:0 22px; height:39px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .grp.icons button { padding:0; width:61px; }
  .single { background:var(--btn); border-radius:6px; box-shadow:var(--shadow); font-weight:500; padding:0 22px; position:relative; }
  .grp button.on { color:#fff; }
  #dir button[data-v="Alle"].on, #tf button.on, #cd button[data-v="0"].on { background:var(--blue); }
  #dir button[data-v="Long"].on { background:#9be28e; color:#0b3d0b; }
  #dir button[data-v="Short"].on { background:#dc2626; }
  #cd button[data-v="1"].on { background:var(--sun); } #cd button[data-v="2"].on { background:var(--moon); }
  .spacer { flex:1; }
  .pop { position:absolute; top:44px; left:0; background:var(--pop); border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.15); z-index:20; display:none; text-align:left; }
  .pop.open { display:block; }
  #secPop { width:222px; padding:4px; } #secList { max-height:218px; overflow-y:auto; }
  .opt { display:flex; align-items:center; gap:8px; font-size:11px; padding:5px 6px; border-radius:4px; cursor:pointer; font-weight:400; }
  .opt:hover { background:var(--row); } .opt span.code { margin-left:auto; color:var(--mut); font-size:9.5px; }
  .opt input { margin:0; }
  .leer { width:100%; margin-top:4px; border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:4px; height:24px; font-size:11px; cursor:pointer; }
  #calPop { right:0; left:auto; width:196px; padding:10px 6px 6px; }
  .calhead { display:flex; align-items:center; justify-content:space-between; font-size:11px; padding:0 8px 8px; font-weight:500; }
  .calhead button { border:0; background:none; color:var(--mut); cursor:pointer; font-size:14px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:10px; }
  .cal .dow { color:var(--mut); font-size:9px; padding:3px 0; }
  .cal .d { padding:5px 0; border-radius:4px; cursor:pointer; }
  .cal .d:hover { background:var(--row); } .cal .d.other { color:var(--mut); opacity:.55; }
  .cal .d.off { color:var(--mut); opacity:.35; cursor:default; } .cal .d.off:hover { background:none; }
  .cal .d.today { outline:1px solid var(--line); } .cal .d.sel { background:#0f1b3d; color:#fff; opacity:1; }
  .heute { width:100%; margin-top:6px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:4px; height:26px; font-size:11px; cursor:pointer; }
  .tip { position:relative; }
  .tip::after { content:attr(data-tip); position:absolute; top:46px; right:0; background:var(--pop); color:var(--fg); border:1px solid var(--fg); border-radius:4px; font-size:11px; padding:3px 6px; white-space:nowrap; display:none; font-weight:400; }
  .tip:hover::after, .tip.flash::after { display:block; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th { text-align:left; font-size:13px; padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; font-weight:600; }
  th .ar { color:var(--mut); font-weight:400; font-size:11px; margin-left:4px; } th.sorted .ar { color:var(--fg); }
  td { padding:8px 8px; white-space:nowrap; height:32.5px; }
  tbody tr:nth-child(even) { background:var(--row); }
  td.num, th.num { text-align:right; } td.num, td.tk { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
  td.tk { font-weight:700; }
  .Long { color:var(--long); font-weight:600; } .Short { color:var(--short); font-weight:600; }
  .ic { vertical-align:-2px; margin-left:6px; }
  .tv { display:inline-block; width:16px; height:16px; background:#111; color:#fff; border-radius:3px; font:700 8px/16px system-ui; text-align:center; text-decoration:none; }
  .nm { display:inline-flex; align-items:center; }
  .lg { width:18px; height:18px; border-radius:4px; object-fit:contain; margin-right:9px; background:#fff; flex:none; }
  .lgx { width:18px; height:18px; border-radius:4px; margin-right:9px; flex:none; background:#d6d9e0; color:#4a4f5c; font:700 10px/18px system-ui; text-align:center; }
  .empty { text-align:center; color:var(--mut); padding:40px 0; }
  .foot { display:flex; justify-content:space-between; font-size:12px; margin-top:22px; color:var(--fg); }
  .foot .lg span { margin-left:14px; } .note { color:var(--mut); font-size:11px; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>Tradingsignale <span class="acc">195 Min.</span></h1>
  <p class="intro" id="intro"></p>

  <div class="controls">
    <div class="grp" id="dir"><button data-v="Alle" class="on">Alle</button><button data-v="Long">Long</button><button data-v="Short">Short</button></div>
    <div class="grp" id="tf"><button class="on">195 Min.</button></div>
    <div class="grp icons" id="cd">
      <button data-v="0" class="on" title="Ganzer Tag"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
      <button data-v="1" title="1. Kerze"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-v="2" title="2. Kerze"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </div>
    <div class="single" id="secBtn" style="font-weight:500;color:var(--mut)"><span id="secLabel">Sektor</span> <span style="font-size:9px">&#9013;</span>
      <div class="pop" id="secPop"><div id="secList"></div><button class="leer" id="secClear">Leeren</button></div>
    </div>
    <div class="spacer"></div>
    <div class="single" id="dateBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dateLabel">–</span>
      <div class="pop" id="calPop"><div class="calhead"><button id="calPrev">&#8249;</button><span id="calTitle"></span><button id="calNext">&#8250;</button></div><div class="cal" id="calGrid"></div><button class="heute" id="calToday">Heute</button></div>
    </div>
    <div class="single tip" id="copyBtn" data-tip="Ticker kopieren" style="padding:0;width:56px;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></div>
  </div>

  <div class="wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="empty" class="empty" style="display:none">Keine Signale für diese Auswahl.</div>

  <div class="foot"><div>Gesamt: <b id="total">0</b> Signale</div>
    <div class="lg"><span><svg class="ic" style="margin:0 4px 0 0" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f5b301" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>1. Kerze</span><span><svg class="ic" style="margin:0 4px 0 0" width="12" height="12" viewBox="0 0 24 24" fill="#6366f1"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>2. Kerze</span></div></div>
  <div class="note" id="note"></div>
</div>

<script>
const SECTORS = [["Communication Services","XLC"],["Consumer Discretionary","XLY"],["Consumer Staples","XLP"],["Energy","XLE"],["Financials","XLF"],["Health Care","XLV"],["Industrials","XLI"],["Materials","XLB"],["Real Estate","XLRE"],["Technology","XLK"],["Utilities","XLU"],["Ohne Sektor",""]];
const COLS = [["signal","Signal",""],["name","Aktie",""],["ticker","Ticker",""],["price","Aktienkurs","num"],["mc","Marktkap.","num"],["vol","Volumen","num"],["ind","Industrie / Branche",""],["etf","Sektor",""],["chart","Chart",""]];
const SUN = '<svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f5b301" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="#6366f1"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
/* Logos: mehrere Quellen nacheinander. Leere/weiße Bilder und Fehler -> nächste Quelle, zuletzt Buchstaben-Platzhalter */
const LOGO_SRC = [
  (t, d) => `https://financialmodelingprep.com/image-stock/${t.replace(".", "-")}.png`,
  (t, d) => `https://assets.parqet.com/logos/symbol/${t.replace(".", "-")}?format=png`,
  (t, d) => `https://eodhd.com/img/logos/US/${t.replace(".", "-")}.png`,
  (t, d) => d ? `https://www.google.com/s2/favicons?domain=${d}&sz=128` : null   // Fallback über die Firmen-Website
];
const logoList = img => LOGO_SRC.map(f => f(img.dataset.t, img.dataset.d)).filter(Boolean);
function logoErr(img) {
  const list = logoList(img), i = +img.dataset.i + 1;
  if (i < list.length) {
    img.dataset.i = i;
    if (list[i].includes("google.com/s2")) img.removeAttribute("crossorigin");   // ohne CORS-Prüfung laden
    img.src = list[i]; return;
  }
  const s = document.createElement("span"); s.className = "lgx"; s.textContent = img.dataset.t[0]; img.replaceWith(s);
}
function logoOk(img) {                       // prüft, ob das Bild wirklich etwas Sichtbares enthält
  try {
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data; let vis = 0;
    for (let k = 0; k < d.length; k += 4) if (d[k+3] > 40 && (d[k] < 235 || d[k+1] < 235 || d[k+2] < 235)) vis++;
    if (vis < 8) logoErr(img);                // praktisch leer oder nur weiß
  } catch (e) { /* Bild ohne CORS-Freigabe: nicht prüfbar, also behalten */ }
}
const logo = (t, d) => `<img class="lg" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer" data-i="0" data-t="${t}" data-d="${d || ""}" src="${LOGO_SRC[0](t, d)}" onload="logoOk(this)" onerror="logoErr(this)" alt="">`;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dmy = s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}`;

let D = null, dates = new Set(), sel = "", dir = "Alle", cd = 0, secs = new Set(), sort = {k:"mc", d:-1}, calY = 0, calM = 0, current = [];

/* ---- Zeitangabe mit Sommer-/Winterzeit (USA und Deutschland getrennt) ---- */
function tzOffMin(tz, ms) {
  const p = new Intl.DateTimeFormat("en-US", {timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric"}).formatToParts(new Date(ms));
  const g = t => +p.find(x => x.type === t).value;
  return (Date.UTC(g("year"), g("month")-1, g("day"), g("hour"), g("minute"), g("second")) - ms) / 60000;
}
function etToUtc(y, m, d, h, mi) {          // Wandzeit New York -> UTC-ms
  const guess = Date.UTC(y, m, d, h, mi);
  let ms = guess - tzOffMin("America/New_York", guess) * 60000;
  return guess - tzOffMin("America/New_York", ms) * 60000;
}
const berlin = ms => new Intl.DateTimeFormat("de-DE", {timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit"}).format(new Date(ms));
function introText() {
  const n = new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", year: "numeric", month: "numeric", day: "numeric"}).formatToParts(new Date());
  const g = t => +n.find(x => x.type === t).value;
  const t1 = berlin(etToUtc(g("year"), g("month")-1, g("day"), 12, 45));   // Ende 1. Kerze
  const t2 = berlin(etToUtc(g("year"), g("month")-1, g("day"), 16, 0));    // Ende 2. Kerze
  $("intro").textContent = `Hier findest Du Deine Tradingsignale. Die Signale werden täglich aktualisiert und orientieren sich an der US-Börsenzeit. Dies entspricht aktuell ${t1} Uhr und ${t2} Uhr deutscher Zeit.`;
}

/* ---- Formatierung ---- */
const fPrice = v => v.toFixed(2) + "$";
const fCap = v => v == null ? "–" : v >= 1e9 ? Math.round(v/1e9) + " Mrd.$" : Math.round(v/1e6) + " Mio.$";
const fVol = v => v >= 1e6 ? Math.round(v/1e6) + " Mio." : Math.round(v/1e3) + " T.";

/* ---- Daten ---- */
function visible() {
  const rows = D.signals.filter(r => r[1] === sel).map(r => {
    const s = D.stocks[r[0]] || {};
    return {ticker: r[0], candle: r[2], signal: r[3] === "L" ? "Long" : "Short", price: r[4], vol: r[5],
            name: s.n || r[0], mc: s.mc ?? null, ind: s.i || "", dom: s.d || "", sector: s.s || "Ohne Sektor", etf: s.e || ""};
  }).filter(r => (dir === "Alle" || r.signal === dir) && (!cd || r.candle === cd) && (!secs.size || secs.has(r.sector)));
  const k = sort.k, m = sort.d;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * m;
  });
  return rows;
}
function render() {
  current = visible();
  $("head").innerHTML = COLS.map(([k, t, c]) => `<th class="${c} ${sort.k === k ? "sorted" : ""}" data-k="${k}">${t}${k !== "chart" ? `<span class="ar">${sort.k === k ? (sort.d < 0 ? "↓" : "↑") : "⇅"}</span>` : ""}</th>`).join("");
  $("rows").innerHTML = current.map(r => `<tr>
    <td><span class="${r.signal}">${r.signal}</span>${r.candle === 1 ? SUN : MOON}</td>
    <td><span class="nm">${logo(r.ticker, r.dom)}${r.name}</span></td><td class="tk">${r.ticker}</td>
    <td class="num">${fPrice(r.price)}</td><td class="num">${fCap(r.mc)}</td><td class="num">${fVol(r.vol)}</td>
    <td>${r.ind}</td><td class="tk" style="font-weight:600">${r.etf}</td>
    <td><a class="tv" target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(r.ticker)}&interval=195">TV</a></td></tr>`).join("");
  $("empty").style.display = current.length ? "none" : "block";
  $("total").textContent = current.length;
  $("dateLabel").textContent = sel ? dmy(sel) : "–";
  $("secLabel").textContent = secs.size ? `Sektor (${secs.size})` : "Sektor";
  document.querySelectorAll("#head th").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (k === "chart") return;
    sort = sort.k === k ? {k, d: -sort.d} : {k, d: (k === "name" || k === "ticker" || k === "ind" || k === "etf" || k === "signal") ? 1 : -1}; render();
  });
}

/* ---- Filter ---- */
function group(id, fn) {
  document.querySelectorAll(`#${id} button[data-v]`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset.v); render(); });
}
group("dir", v => dir = v);
group("cd", v => cd = +v);

/* Sektor-Popup */
$("secList").innerHTML = SECTORS.map(([n, e]) => `<label class="opt"><input type="checkbox" value="${n}"><span>${n}</span><span class="code">${e}</span></label>`).join("");
$("secList").onchange = e => { e.target.checked ? secs.add(e.target.value) : secs.delete(e.target.value); render(); };
$("secClear").onclick = e => { e.stopPropagation(); secs.clear(); document.querySelectorAll("#secList input").forEach(i => i.checked = false); render(); };

/* Kalender */
function renderCal() {
  $("calTitle").textContent = new Date(calY, calM, 1).toLocaleDateString("de-DE", {month: "long", year: "numeric"});
  const first = new Date(calY, calM, 1), dow = (first.getDay() + 6) % 7, today = ymd(new Date());
  let h = ["Mo","Di","Mi","Do","Fr","Sa","So"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(calY, calM, 1 - dow + i), k = ymd(d), on = dates.has(k);
    h += `<div class="d ${d.getMonth() !== calM ? "other" : ""} ${on ? "" : "off"} ${k === sel ? "sel" : ""} ${k === today ? "today" : ""}" data-k="${k}">${d.getDate()}</div>`;
  }
  $("calGrid").innerHTML = h;
  $("calGrid").querySelectorAll(".d:not(.off)").forEach(el => el.onclick = e => { e.stopPropagation(); sel = el.dataset.k; closePops(); render(); });
}
const latest = () => [...dates].sort().pop();
$("calPrev").onclick = e => { e.stopPropagation(); if (--calM < 0) { calM = 11; calY--; } renderCal(); };
$("calNext").onclick = e => { e.stopPropagation(); if (++calM > 11) { calM = 0; calY++; } renderCal(); };
$("calToday").onclick = e => { e.stopPropagation(); sel = dates.has(ymd(new Date())) ? ymd(new Date()) : latest(); closePops(); render(); };
$("calPop").onclick = e => e.stopPropagation(); $("secPop").onclick = e => e.stopPropagation();

function closePops() { document.querySelectorAll(".pop").forEach(p => p.classList.remove("open")); }
$("secBtn").onclick = () => { const o = $("secPop").classList.contains("open"); closePops(); if (!o) $("secPop").classList.add("open"); };
$("dateBtn").onclick = () => { const o = $("calPop").classList.contains("open"); closePops(); if (!o) { const d = new Date((sel || ymd(new Date())) + "T12:00:00"); calY = d.getFullYear(); calM = d.getMonth(); renderCal(); $("calPop").classList.add("open"); } };
document.addEventListener("click", e => { if (!e.target.closest("#secBtn") && !e.target.closest("#dateBtn")) closePops(); });

/* Ticker kopieren */
$("copyBtn").onclick = async () => {
  const txt = current.map(r => r.ticker).join(",");
  try { await navigator.clipboard.writeText(txt); } catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  $("copyBtn").dataset.tip = "Kopiert!"; $("copyBtn").classList.add("flash");
  setTimeout(() => { $("copyBtn").classList.remove("flash"); $("copyBtn").dataset.tip = "Ticker kopieren"; }, 1400);
};

/* Start */
introText();
fetch("data/signals.json?" + Date.now()).then(r => r.json()).then(d => {
  D = d;
  d.signals.forEach(r => dates.add(r[1]));
  sel = latest() || "";
  const g = new Intl.DateTimeFormat("de-DE", {dateStyle: "medium", timeStyle: "short", timeZone: "Europe/Berlin"}).format(new Date(d.generated));
  $("note").textContent = `Signal: EMA ${d.settings.ema_fast} kreuzt EMA ${d.settings.ema_slow} auf der 195-Min-Kerze (Long: von unten nach oben, Short: von oben nach unten). Universum: S&P 500. Daten: Yahoo Finance. Stand: ${g}. Reine Information, keine Anlageberatung.`;
  render();
}).catch(() => { $("empty").style.display = "block"; $("empty").textContent = "Noch keine Daten – Workflow „Screener“ einmal starten."; render(); });
</script>
</body>
</html>
